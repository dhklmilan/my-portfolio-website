<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fire Incidents and Burn Severity Map, 2024</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="fstyle.css">
</head>
<body>


  <header class="topbar">
     <h1>Ecosystem Response to Burn Severity</h1>
    <h1>Terai Arc Landscape (TAL), Nepal</h1>
  </header>

  <div id="map" aria-label="Fire map"></div>
  <div id="status" class="status" role="status">Loading layers (wait for few sec)…</div>

  <!--  popup message not uploading-->
    <div id="fireInfoMessage" class="fire-info-message">
<div id="hint" class="hint hide" role="status">
  <span>Click a fire point on the map to view detailed fire information.</span>
  <button id="hint-close" type="button" aria-label="Close message">&times;</button>
</div>


  <!-- Libraries -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/proj4@2.9.2/dist/proj4.js"></script>
  <script src="https://unpkg.com/shpjs@4.0.4/dist/shp.min.js"></script>
  <script src="https://unpkg.com/georaster@1.6.0/dist/georaster.browser.bundle.min.js"></script>
  <script src="https://unpkg.com/georaster-layer-for-leaflet@3.10.0/dist/georaster-layer-for-leaflet.min.js"></script>

  <!-- App -->
  <script src="fconfig.js"></script>
  <script src="fapp.js"></script>
</body>
</html>
